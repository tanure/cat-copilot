name: Desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pwa:check
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        with:
          name: catpilot-pwa
          path: apps/pwa/dist/
          retention-days: 7
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            executable: apps/desktop/release/win-unpacked/CatPilot.exe
          - os: macos-latest
            platform: mac
            arch: arm64
            executable: apps/desktop/release/mac-arm64/CatPilot.app/Contents/MacOS/CatPilot
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: apps/desktop/release/mac/CatPilot.app/Contents/MacOS/CatPilot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:provider
      - run: npm run test:signing
      - run: npm run desktop:check
      # Builds the Electron entry point needed by the two source-renderer checks below.
      - run: npm run test:electron
        timeout-minutes: 8
      - run: npm run test:proposal-ui
      - run: npm run test:workflows-ui
      - run: npm run test:design-ui
      - name: Build native installer and unpacked app
        run: npm run dist --workspace @catpilot/desktop -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged app
        run: node test/electron-smoke.mjs
        env:
          CATPILOT_TEST_EXE: ${{ github.workspace }}/${{ matrix.executable }}
          CATPILOT_TEST_LARGE: "1"
      - name: Verify npm package contents
        run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: catpilot-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: apps/desktop/release/
          retention-days: 7
