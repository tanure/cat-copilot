appId: io.catpilot.desktop
productName: CatPilot
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/@github/copilot-sdk-*/**/*
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: ../../assets/catpilot-pixel.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  icon: ../../assets/catpilot-pixel.png
